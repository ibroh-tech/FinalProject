server:
  port: 8081

spring:
  application:
    name: assistant-backend
  datasource:
    url: ${ASSISTANT_DB_URL:jdbc:postgresql://localhost:5432/assistant_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
