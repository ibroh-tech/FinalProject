server:
  port: 8080

spring:
  application:
    name: sample-api
  datasource:
    url: ${SAMPLE_API_DB_URL:jdbc:postgresql://localhost:5432/sample_api}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
